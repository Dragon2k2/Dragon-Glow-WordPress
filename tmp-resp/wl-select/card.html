<!DOCTYPE html><html class="dg-js"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=block">
<link rel="stylesheet" href="https://dragonglow.freehosting.dev/wp-content/themes/dragon-glow/style.css">
<link rel="stylesheet" href="https://dragonglow.freehosting.dev/wp-content/themes/dragon-glow/assets/css/main.css">
<link rel="stylesheet" href="https://dragonglow.freehosting.dev/wp-content/themes/dragon-glow/assets/css/wishlist.css">
</head>
<body style="margin:0; background:#f7f4ef;">
  <div class="dg-wishlist">
    <div class="dg-wishlist-grid">
      <article class="dg-wishlist-card" data-dg-wl-card data-in-stock="1" data-on-sale="0" data-price="36.00" data-name="Blushbloome Petal Blush">
        <label class="dg-wishlist-card__select" aria-label="Select item">
          <input type="checkbox" class="dg-wishlist-card__checkbox" data-dg-wl-select value="43">
          <span class="dg-wishlist-card__checkbox-mark" aria-hidden="true">
            <span class="material-symbols-outlined">check</span>
          </span>
        </label>
        <button type="button" class="dg-wishlist-card__heart is-active dg-wishlist-toggle" data-product-id="43" data-dg-wl-remove aria-label="Remove from wishlist">
          <span class="material-symbols-outlined">favorite</span>
        </button>
        <a href="#" class="dg-wishlist-card__media">
          <img src="https://dragonglow.freehosting.dev/wp-content/uploads/woocommerce-placeholder.png" alt="Blushbloome Petal Blush" class="dg-wishlist-card__img dg-wishlist-card__img--primary">
        </a>
        <div class="dg-wishlist-card__body">
          <h3 class="dg-wishlist-card__name"><a href="#">Blushbloome Petal Blush</a></h3>
          <p class="dg-wishlist-card__price">$36.00</p>
          <button class="dg-wishlist-card__cta wc-add-to-cart-btn" data-product-id="43">Add to bag</button>
        </div>
      </article>
    </div>
  </div>
</body></html>
